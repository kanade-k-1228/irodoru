name: Embedded CPU runtime
description: Restore the pinned static runtime from cache or a retained build artifact.
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@v5
      id: cpu
      with:
        path: target/cpu-ort/lib
        key: windows-cpu-ort-${{ hashFiles('scripts/build-cpu-ort.ps1') }}
    - id: archive
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CACHE_KEY: ${{ steps.cpu.outputs.cache-primary-key }}
        REPOSITORY_ID: ${{ github.repository_id }}
      run: |
        # Only trust builds from this repository, never artifacts produced by forks.
        run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$CACHE_KEY&per_page=100" \
          --jq ".artifacts | map(select(.expired == false and .workflow_run.head_repository_id == $REPOSITORY_ID)) | .[0].workflow_run.id // empty")
        echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
    - uses: actions/download-artifact@v8
      if: steps.cpu.outputs.cache-hit != 'true' && steps.archive.outputs.run-id != ''
      with:
        name: ${{ steps.cpu.outputs.cache-primary-key }}
        path: target/cpu-ort/lib
        run-id: ${{ steps.archive.outputs.run-id }}
        github-token: ${{ github.token }}
    - name: Build embedded CPU ONNX Runtime
      if: steps.cpu.outputs.cache-hit != 'true' && steps.archive.outputs.run-id == ''
      shell: pwsh
      run: ./scripts/build-cpu-ort.ps1
    - uses: actions/cache/save@v5
      if: steps.cpu.outputs.cache-hit != 'true'
      with:
        path: target/cpu-ort/lib
        key: ${{ steps.cpu.outputs.cache-primary-key }}
    # Artifacts survive cache quota eviction and can be read after merging to main.
    - uses: actions/upload-artifact@v7
      if: steps.archive.outputs.run-id == ''
      with:
        name: ${{ steps.cpu.outputs.cache-primary-key }}
        path: target/cpu-ort/lib/
        if-no-files-found: error
        retention-days: 90
    - name: Configure embedded CPU library
      shell: pwsh
      run: '"IRODORU_CPU_ORT_LIB_DIR=$((Resolve-Path target/cpu-ort/lib).Path)" >> $env:GITHUB_ENV'
