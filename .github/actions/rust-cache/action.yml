name: Reusable Rust compilation
description: Restore Cargo dependencies and cache compilation results, including on PRs.
inputs:
  key:
    description: Separate incompatible job and target configurations.
    required: true
runs:
  using: composite
  steps:
    - uses: mozilla-actions/sccache-action@v0.0.11
      with:
        version: v0.16.0
    - id: compiler
      shell: bash
      run: |
        echo "hash=$(rustc -Vv | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
        echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> "$GITHUB_ENV"
        echo 'SCCACHE_CACHE_SIZE=2G' >> "$GITHUB_ENV"
        # Read existing individual objects during migration; batch all new writes.
        echo 'SCCACHE_GHA_ENABLED=true' >> "$GITHUB_ENV"
        echo 'SCCACHE_GHA_RW_MODE=READ_ONLY' >> "$GITHUB_ENV"
        echo 'SCCACHE_MULTILEVEL_CHAIN=disk,gha' >> "$GITHUB_ENV"
        echo 'RUSTC_WRAPPER=sccache' >> "$GITHUB_ENV"
    - uses: actions/cache/restore@v6
      id: compiler-cache
      with:
        path: ${{ runner.temp }}/sccache
        key: sccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.key }}-${{ steps.compiler.outputs.hash }}-${{ hashFiles('Cargo.*', '.cargo/**', 'pkgs/**', '!pkgs/app/resources/models/**', 'xtask/**', 'scripts/**', '.github/actions/**', '.github/workflows/app.yml') }}
        # sccache checks each object's inputs, so older archives are safe seeds.
        restore-keys: sccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.key }}-${{ steps.compiler.outputs.hash }}-
    - shell: bash
      env:
        ARCHIVE_KEY: ${{ steps.compiler-cache.outputs.cache-primary-key }}
        ARCHIVE_HIT: ${{ steps.compiler-cache.outputs.cache-hit }}
      run: |
        echo "SCCACHE_ARCHIVE_KEY=$ARCHIVE_KEY" >> "$GITHUB_ENV"
        echo "SCCACHE_ARCHIVE_HIT=$ARCHIVE_HIT" >> "$GITHUB_ENV"
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: . -> target
        key: ${{ inputs.key }}
        cache-on-failure: true
        # sccache stores compiler outputs by content; avoid duplicating target trees.
        cache-targets: false
        # Tool binaries have their own immutable versioned cache.
        cache-bin: false
