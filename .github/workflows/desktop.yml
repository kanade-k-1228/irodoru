name: desktop
on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  models:
    uses: ./.github/workflows/models.yml
  build:
    needs: models
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt,clippy
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - uses: actions/download-artifact@v4
        with:
          name: app-models
          path: pkgs/app/src-tauri/resources/models
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:check app-types
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p irodoru-desktop --features desktop --all-targets -- -D warnings
      - run: cargo test --locked -p irodoru-desktop
      - name: Set release version
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: node scripts/release.mts version "$RELEASE_TAG"
      - run: pnpm build:app --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: irodoru-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
          compression-level: 0
      - name: Attach installers to GitHub Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TARGET: ${{ matrix.target }}
        run: |
          node scripts/release.mts app "$RELEASE_TAG" "$TARGET"
