name: app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    uses: ./.github/workflows/verify.yml

  models:
    uses: ./.github/workflows/models.yml

  build:
    name: build (${{ matrix.platform }})
    needs: models
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            family: desktop
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: target/x86_64-pc-windows-msvc/release/bundle/
          - platform: macos-arm64
            family: desktop
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: target/aarch64-apple-darwin/release/bundle/
          - platform: linux
            family: desktop
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            artifact: target/x86_64-unknown-linux-gnu/release/bundle/
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt,clippy
      - name: Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config clang cmake libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libzstd-dev libasound2-dev libvulkan1 patchelf libfuse2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@v8
        with:
          name: app-models
          path: pkgs/app/resources/models
      - name: Check desktop native code
        env:
          IRODORU_TEST_MODELS: ${{ github.workspace }}/pkgs/app/resources/models
          MACOSX_DEPLOYMENT_TARGET: "15.0"
        if: matrix.family == 'desktop'
        run: |
          cargo clippy --locked -p irodoru-desktop --features desktop --all-targets -- -D warnings
          cargo test --locked -p irodoru-desktop
          cargo test --locked --release -p irodoru-desktop --test embedded -- --ignored
      - name: Set release version
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: cargo xtask release version "$RELEASE_TAG"
      - name: Install packager
        if: matrix.platform != 'windows'
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build and package desktop
        env:
          TARGET: ${{ matrix.target }}
        run: cargo xtask package --target "$TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: irodoru-${{ matrix.family }}-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          compression-level: 0

  required:
    if: always()
    needs: [check, models, build]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Check that all jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [[ "$result" == success ]] || { echo "::error::some CI jobs did not succeed"; exit 1; }
          done

  release:
    if: github.event_name == 'release'
    needs: required
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          pattern: irodoru-desktop-*
          path: artifacts
      - name: Attach app packages after all checks and builds succeed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          for artifact in artifacts/irodoru-desktop-*; do
            target=${artifact##*/irodoru-desktop-}
            mkdir -p "target/$target/release"
            mv "$artifact" "target/$target/release/bundle"
            cargo xtask release app "$RELEASE_TAG" "$target"
          done
