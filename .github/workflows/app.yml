name: app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  check:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check workflow syntax and shell scripts
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask verify
      - run: docker compose --profile local --profile wsl-gpu config --quiet
      - uses: astral-sh/setup-uv@v7
      - run: cargo xtask verify-export

  models:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: models
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked --release -p xtask
      # Cache only the prepared bundle (~3.4 GB), not unused portable exports.
      # Both the exporter inputs and the bundle preparation code affect its contents.
      - uses: actions/cache/restore@v6
        id: models
        with:
          path: pkgs/app/resources/models
          key: anime-bundle-v1-${{ hashFiles('licenses/**', 'pkgs/engine/script/*.py', 'pkgs/engine/script/pyproject.toml', 'pkgs/engine/script/uv.lock', 'pkgs/engine/script/.python-version', 'xtask/src/models.rs', 'xtask/src/models/**', 'pkgs/model-bundle/**', 'xtask/Cargo.toml') }}
      - uses: astral-sh/setup-uv@v7
        if: steps.models.outputs.cache-hit != 'true'
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Export and prepare models on cache miss
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          uv sync --project pkgs/engine/script --frozen
          uv run --project pkgs/engine/script python pkgs/engine/script/export_onnx.py --out models --models anime
          target/release/xtask models prepare
      # Distribution verifies file checksums even when the bundle came from cache.
      - name: Prepare one model ZIP for GHCR
        env:
          PUBLISH_MODELS: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          args=()
          if [[ "$PUBLISH_MODELS" == 'true' ]]; then
            args+=(--repository "${GITHUB_REPOSITORY,,}-models")
          fi
          target/release/xtask models distribute "${args[@]}"
      - uses: actions/cache/save@v6
        if: steps.models.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        with:
          path: pkgs/app/resources/models
          key: ${{ steps.models.outputs.cache-primary-key }}
      - uses: oras-project/setup-oras@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          version: 1.3.6
      - name: Authenticate to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish models and verify public access before building apps
        if: startsWith(github.ref, 'refs/tags/')
        run: target/release/xtask models publish
      - uses: actions/upload-artifact@v7
        with:
          name: app-model-manifest
          path: model-assets/model-distribution.json
          if-no-files-found: error
          retention-days: 1

  licenses:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: licenses
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: cargo xtask release version "$RELEASE_TAG"
      # Manifests, notices and policy can change without changing Cargo.lock.
      - uses: actions/cache@v6
        id: licenses
        with:
          path: ${{ runner.temp }}/licenses
          key: licenses-v1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'pkgs/*/Cargo.toml', 'xtask/Cargo.toml', 'about.toml', 'LICENSE', 'licenses/**', 'pkgs/app/icons/ui/LICENSE', 'xtask/src/licenses.rs') }}
      - name: Generate shared license bundle on cache miss
        if: steps.licenses.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-about --version 0.9.3 --locked --features cli
          cargo fetch --locked
          cargo xtask licenses --destination "$RUNNER_TEMP/licenses"
      - uses: actions/upload-artifact@v7
        with:
          name: app-licenses
          path: ${{ runner.temp }}/licenses/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build:
    name: build (${{ matrix.platform }})
    needs: [models, licenses]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: target/x86_64-pc-windows-msvc/release/bundle/
          - platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: target/aarch64-apple-darwin/release/bundle/
          - platform: linux
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: target/x86_64-unknown-linux-gnu/release/bundle/
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt,clippy
      - name: Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config clang cmake libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libzstd-dev libasound2-dev libvulkan1 patchelf libfuse2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.target }}
          cache-on-failure: true
          # PR caches cannot be reused by other PRs and evict the shared main cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@v8
        with:
          name: app-model-manifest
          path: pkgs/app/resources
      - uses: actions/download-artifact@v8
        with:
          name: app-licenses
          path: ${{ runner.temp }}/licenses
      - name: Check desktop native code
        env:
          MACOSX_DEPLOYMENT_TARGET: "15.0"
        run: |
          cargo clippy --locked -p irodoru --features desktop --all-targets -- -D warnings
          cargo test --locked -p irodoru
      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: cargo xtask release version "$RELEASE_TAG"
      - name: Install packager
        if: matrix.platform != 'windows'
        run: cargo install cargo-packager --version 0.11.8 --locked
      # Fetch cargo-packager 0.11.8 tools through the API; browser download URLs return 504.
      - name: Fetch AppImage tools
        if: matrix.platform == 'linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          appimage_tools="${XDG_CACHE_HOME:-$HOME/.cache}/.cargo-packager/AppImage"
          mkdir -p "$appimage_tools"
          gh api -H 'Accept: application/octet-stream' repos/tauri-apps/binary-releases/releases/assets/274691722 > "$appimage_tools/AppRun-x86_64"
          printf '%s  %s\n' f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f "$appimage_tools/AppRun-x86_64" | sha256sum --check
          gh api -H 'Accept: application/octet-stream' repos/tauri-apps/binary-releases/releases/assets/182515537 > "$appimage_tools/linuxdeploy-x86_64.AppImage"
          printf '%s  %s\n' e762bea85c8eb0d4b3508d46e5c1f037f717d0f9303ae3b4aafc8b04991fa1ef "$appimage_tools/linuxdeploy-x86_64.AppImage" | sha256sum --check
          gh api -H 'Accept: application/octet-stream' repos/linuxdeploy/linuxdeploy-plugin-appimage/releases/assets/602435573 > "$appimage_tools/linuxdeploy-plugin-appimage.AppImage"
          printf '%s  %s\n' 49d6a17160675a6bd1781699aae6bdf7692d98552e02a3671d2183d10547842e "$appimage_tools/linuxdeploy-plugin-appimage.AppImage" | sha256sum --check
          chmod 755 "$appimage_tools/AppRun-x86_64" "$appimage_tools/linuxdeploy-x86_64.AppImage" "$appimage_tools/linuxdeploy-plugin-appimage.AppImage"
          gh api -H 'Accept: application/octet-stream' repos/AppImage/type2-runtime/releases/assets/657374641 > "$appimage_tools/runtime-x86_64"
          printf '%s  %s\n' 617aa77314d57c8b8e4fae9c3f0b35af7b30d5529cb69e98f64f92510ed98a46 "$appimage_tools/runtime-x86_64" | sha256sum --check
          printf 'LDAI_RUNTIME_FILE=%s\n' "$appimage_tools/runtime-x86_64" >> "$GITHUB_ENV"
      - name: Build and package desktop
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo xtask package --target "$TARGET" --licenses-dir "$RUNNER_TEMP/licenses"
      - name: Verify package contents
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/check-package.sh "$TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: irodoru-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          compression-level: 0

  required:
    if: always()
    needs: [check, models, licenses, build]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Check that all jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [[ "$result" == success ]] || { echo "::error::some CI jobs did not succeed"; exit 1; }
          done
