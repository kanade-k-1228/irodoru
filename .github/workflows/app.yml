name: app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  check:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check workflow syntax and shell scripts
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask verify
      - run: docker compose --profile local --profile wsl-gpu config --quiet
      - uses: astral-sh/setup-uv@v7
      - run: cargo xtask verify-export

  models:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: models
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked --release -p xtask
      # Cache only the prepared bundle (~3.4 GB), not unused portable exports.
      # Both the exporter inputs and the bundle preparation code affect its contents.
      - uses: actions/cache/restore@v6
        id: models
        with:
          path: pkgs/app/resources/models
          key: anime-bundle-v1-${{ hashFiles('pkgs/engine/script/*.py', 'pkgs/engine/script/pyproject.toml', 'pkgs/engine/script/uv.lock', 'pkgs/engine/script/.python-version', 'xtask/src/models.rs', 'xtask/Cargo.toml') }}
      - uses: astral-sh/setup-uv@v7
        if: steps.models.outputs.cache-hit != 'true'
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Export and prepare models on cache miss
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          uv sync --project pkgs/engine/script --frozen
          uv run --project pkgs/engine/script python pkgs/engine/script/export_onnx.py --out models --models anime
          target/release/xtask models prepare
      # Distribution verifies file checksums even when the bundle came from cache.
      - name: Prepare one model ZIP for GHCR
        env:
          PUBLISH_MODELS: ${{ github.event_name == 'release' }}
        run: |
          args=()
          if [[ "$PUBLISH_MODELS" == 'true' ]]; then
            args+=(--repository "${GITHUB_REPOSITORY,,}-models")
          fi
          target/release/xtask models distribute "${args[@]}"
      - uses: actions/cache/save@v6
        if: steps.models.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        with:
          path: pkgs/app/resources/models
          key: ${{ steps.models.outputs.cache-primary-key }}
      - uses: oras-project/setup-oras@v2
        if: github.event_name == 'release'
        with:
          version: 1.3.6
      - name: Authenticate to GHCR
        if: github.event_name == 'release'
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish models and verify public access before building apps
        if: github.event_name == 'release'
        run: target/release/xtask models publish
      - uses: actions/upload-artifact@v7
        with:
          name: app-model-manifest
          path: model-assets/model-distribution.json
          if-no-files-found: error
          retention-days: 1
      # Test fixtures are downloaded outside app resources and never packaged.
      - uses: actions/upload-artifact@v7
        with:
          name: app-models
          path: pkgs/app/resources/models/
          compression-level: 0
          retention-days: 1

  build:
    name: build (${{ matrix.platform }})
    needs: models
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            family: desktop
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: target/x86_64-pc-windows-msvc/release/bundle/
          - platform: macos-arm64
            family: desktop
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: target/aarch64-apple-darwin/release/bundle/
          - platform: linux
            family: desktop
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: target/x86_64-unknown-linux-gnu/release/bundle/
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt,clippy
      - name: Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config clang cmake libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libzstd-dev libasound2-dev libvulkan1 patchelf libfuse2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.target }}
          cache-on-failure: true
          # PR caches cannot be reused by other PRs and evict the shared main cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@v8
        with:
          name: app-model-manifest
          path: pkgs/app/resources
      - uses: actions/download-artifact@v8
        with:
          name: app-models
          path: ${{ runner.temp }}/irodoru-test-models
      - name: Check desktop native code
        env:
          TARGET: ${{ matrix.target }}
          IRODORU_TEST_MODELS: ${{ runner.temp }}/irodoru-test-models
          MACOSX_DEPLOYMENT_TARGET: "15.0"
        run: |
          cargo clippy --locked -p irodoru-desktop --features desktop --all-targets -- -D warnings
          cargo test --locked -p irodoru-desktop
          cargo test --locked --release --target "$TARGET" -p irodoru-desktop --features desktop --test embedded -- --ignored
      - name: Set release version
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: cargo xtask release version "$RELEASE_TAG"
      - name: Install packager
        if: matrix.platform != 'windows'
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build and package desktop
        env:
          TARGET: ${{ matrix.target }}
        run: cargo xtask package --target "$TARGET"
      - name: Verify lightweight packages and offline synthesis with external models
        env:
          IRODORU_TEST_MODELS: ${{ runner.temp }}/irodoru-test-models
          TARGET: ${{ matrix.target }}
        run: bash scripts/smoke-package.sh "$TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: irodoru-${{ matrix.family }}-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          compression-level: 0

  required:
    if: always()
    needs: [check, models, build]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Check that all jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [[ "$result" == success ]] || { echo "::error::some CI jobs did not succeed"; exit 1; }
          done

  release:
    if: github.event_name == 'release'
    needs: required
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          pattern: irodoru-desktop-*
          path: artifacts
      - name: Attach app packages after all checks and builds succeed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          for artifact in artifacts/irodoru-desktop-*; do
            target=${artifact##*/irodoru-desktop-}
            mkdir -p "target/$target/release"
            mv "$artifact" "target/$target/release/bundle"
            cargo xtask release app "$RELEASE_TAG" "$target"
          done
