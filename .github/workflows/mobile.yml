name: mobile
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  models:
    uses: ./.github/workflows/models.yml
  android:
    needs: models
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'ndk;27.2.12479018'
      - run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: app-models
          path: pkgs/app/src-tauri/resources/models
      - run: pnpm install --frozen-lockfile
      - run: pnpm android:init --ci
      - run: pnpm android:build --debug --apk
      - uses: actions/upload-artifact@v4
        with:
          name: irodoru-android-debug
          path: pkgs/app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          compression-level: 0
  ios:
    needs: models
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: app-models
          path: pkgs/app/src-tauri/resources/models
      - run: pnpm install --frozen-lockfile
      - run: pnpm ios:init --ci
      - run: pnpm ios:build --debug --target aarch64-sim
      - name: Preserve simulator app permissions and symlinks
        run: |
          app=$(find pkgs/app/src-tauri/gen/apple/build -name '*.app' -type d -print -quit)
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" irodoru-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: irodoru-ios-simulator
          path: irodoru-ios-simulator.zip
          if-no-files-found: error
          compression-level: 0
