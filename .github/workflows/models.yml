name: app-models
on:
  workflow_call:
permissions:
  contents: read
jobs:
  anime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v7
      - uses: actions/cache@v6
        id: models
        with:
          path: models
          key: anime-onnx-${{ hashFiles('pkgs/engine/script/**') }}
      - if: steps.models.outputs.cache-hit != 'true'
        run: |
          uv sync --project pkgs/engine/script --frozen
          uv run --project pkgs/engine/script python pkgs/engine/script/export_onnx.py --out models --models anime
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo xtask models prepare
      - uses: actions/upload-artifact@v7
        with:
          name: app-models
          path: pkgs/app/resources/models/
          compression-level: 0
          retention-days: 1
