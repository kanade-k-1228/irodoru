[package]
name = "irodoru-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
openvino = ["dep:openvino", "dep:openvino-sys"]

[dependencies]
anyhow = "1"
sha2 = "0.11"
hound = "3.5"
ndarray = "0.17"
openvino = { version = "=0.11.1", optional = true, features = ["runtime-linking"] }
openvino-sys = { version = "=0.11.1", optional = true, features = ["runtime-linking"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "copy-dylibs", "tls-rustls"] }
rand = "0.10"
rand_distr = "0.6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
tracing = "0.1"
unicode-normalization = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["alternative-backend", "api-27"] }
libloading = "0.8.9"
windows = { version = "0.62.2", features = ["Win32_Storage_Packaging_Appx", "Win32_Security", "Win32_System_Memory", "Win32_System_WinRT"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["coreml"] }
