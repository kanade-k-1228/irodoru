[package]
name = "irodoru-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["ort-download"]
ort-download = ["ort/download-binaries", "ort/copy-dylibs", "ort/tls-rustls"]
openvino = ["dep:openvino", "dep:openvino-sys"]

[dependencies]
anyhow = "1"
sha2 = "0.11"
hound = "3.5"
ndarray = "0.17"
openvino = { version = "=0.11.1", optional = true, features = ["runtime-linking"] }
openvino-sys = { version = "=0.11.1", optional = true, features = ["runtime-linking"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "tracing"] }
rand = "0.10"
rand_distr = "0.6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
tracing = "0.1"
unicode-normalization = "0.1"
