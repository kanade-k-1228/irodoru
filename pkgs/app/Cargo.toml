[package]
name = "irodoru"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Offline speech synthesis studio"

[dependencies]
irodoru-model-bundle = { path = "../model-bundle" }
irodoru-engine = { path = "../engine" }
anyhow = "1"
url = "2"
base64 = "0.23"
hound = "3.5"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
indexmap = { version = "2", features = ["serde"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
tempfile = "3"
sha2 = "0.11"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
gpui-kit = { version = "=0.9.1" }
rodio = { version = "=0.23.0", default-features = false, features = ["playback", "wav"] }
rfd = { version = "0.18" }
clap = { version = "4", features = ["derive"] }
directories = "6"
symphonia = { version = "0.6", features = ["all"] }
rubato = "5.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
resvg = "0.49"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"

[build-dependencies]
embed-resource = "3.0"
