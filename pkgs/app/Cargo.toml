[package]
name = "irodoru-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Offline speech synthesis studio"
default-run = "irodoru-desktop"

[features]
default = []
desktop = ["dep:gpui-kit", "dep:rodio", "dep:rfd"]

[dependencies]
irodoru-engine = { path = "../engine" }
anyhow = "1"
base64 = "0.23"
hound = "3.5"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
zip = { version = "9", default-features = false, features = ["deflate"] }
tempfile = "3"
sha2 = "0.11"
gpui-kit = { version = "=0.9.0", optional = true }
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "wav"], optional = true }
rfd = { version = "0.17", optional = true }
directories = "6"
symphonia = { version = "0.5", features = ["all"] }
rubato = "0.16"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
resvg = "0.45"

[[bin]]
name = "irodoru-desktop"
path = "src/main.rs"
required-features = ["desktop"]
