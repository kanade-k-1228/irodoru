[package]
name = "irodoru-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Offline speech synthesis application with embedded anime model"
default-run = "irodoru-desktop"

[features]
default = []
typegen = []
custom-protocol = ["tauri/custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-fs", "dep:tauri-plugin-single-instance"]

[dependencies]
irodoru-engine = { path = "../../engine" }
anyhow = "1"
base64 = "0.23"
hound = "3.5"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
zip = { version = "9", default-features = false, features = ["deflate"] }
tempfile = "3"
ts-rs = { version = "12", features = ["serde-compat", "serde-json-impl"] }
tauri = { version = "2", optional = true, features = ["protocol-asset"] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-fs = { version = "2", optional = true }
sha2 = "0.11"

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[[bin]]
name = "irodoru-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "desktop-types"
path = "src/bin/types.rs"
required-features = ["typegen"]

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", optional = true }
