# Prefer Apache for dual-licensed crates. AND requirements remain cumulative.
# Include build dependencies because generated code can enter the executable.
accepted = [
    "Apache-2.0", "MIT", "ISC", "BSD-2-Clause", "BSD-3-Clause", "0BSD",
    "MPL-2.0", "Unicode-3.0", "Zlib", "BSL-1.0", "CC0-1.0", "Unlicense",
    "NCSA", "CDLA-Permissive-2.0", "Apache-2.0 WITH LLVM-exception",
]
targets = [
    "x86_64-pc-windows-msvc", "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
]
ignore-dev-dependencies = true
workarounds = ["ring", "rustls", "rustix"]

[ring]
accepted = ["OpenSSL"]
